name: Build PetrichorLegacy UI 0.7.1

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply 0.4.1 source patch
        run: python3 tools/patch_petrichorlegacy_041.py
      - name: Apply 0.5.0 seven-class patch
        run: python3 tools/patch_petrichorlegacy_050.py
      - name: Apply 0.5.1 early progression patch
        run: python3 tools/patch_petrichorlegacy_051.py
      - name: Apply 0.6.0 enemy affix patch
        run: python3 tools/patch_petrichorlegacy_060.py
      - name: Apply 0.6.1 gameplay affix rework
        run: python3 tools/patch_petrichorlegacy_061.py
      - name: Apply 0.6.2 rarity and progression UI patch
        run: python3 tools/patch_petrichorlegacy_062.py
      - name: Apply 0.6.3 ten-step Legacy patch
        run: python3 tools/patch_petrichorlegacy_063.py
      - name: Prepare 0.7.0 schema migration
        run: python3 tools/patch_petrichorlegacy_070_compat.py
      - name: Apply 0.7.0 mastery and perfection overhaul
        run: python3 tools/patch_petrichorlegacy_070.py
      - name: Apply 0.7.1 effective mastery and prestige
        run: python3 tools/patch_petrichorlegacy_071.py
      - name: Restore
        run: dotnet restore PetrichorLegacy/PetrichorLegacy.csproj
      - name: Build
        run: dotnet build PetrichorLegacy/PetrichorLegacy.csproj -c Release --no-restore
      - name: Package
        shell: bash
        run: |
          mkdir -p package/PetrichorLegacy
          cp PetrichorLegacy/bin/Release/netstandard2.1/PetrichorLegacy.dll package/PetrichorLegacy/
          cp PetrichorLegacy/manifest.json package/PetrichorLegacy/
          cp "$HOME/.nuget/packages/newtonsoft.json/12.0.3/lib/net45/Newtonsoft.Json.dll" package/PetrichorLegacy/
          cd package
          zip -r ../PetrichorLegacy-0.7.1.zip PetrichorLegacy
          cd ..
          zip -r PetrichorLegacy-0.7.1-source.zip PetrichorLegacy \
            -x 'PetrichorLegacy/bin/*' 'PetrichorLegacy/obj/*'
      - uses: actions/upload-artifact@v4
        with:
          name: PetrichorLegacy-0.7.1
          path: |
            PetrichorLegacy-0.7.1.zip
            PetrichorLegacy-0.7.1-source.zip
            package/PetrichorLegacy/PetrichorLegacy.dll
            package/PetrichorLegacy/Newtonsoft.Json.dll
          if-no-files-found: error
