name: Build PetrichorLegacy UI 0.4.1

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply 0.4.1 source patch
        run: python3 tools/patch_petrichorlegacy_041.py
      - name: Restore
        run: dotnet restore PetrichorLegacy/PetrichorLegacy.csproj
      - name: Build
        run: dotnet build PetrichorLegacy/PetrichorLegacy.csproj -c Release --no-restore
      - name: Package
        shell: bash
        run: |
          mkdir -p package/PetrichorLegacy
          cp PetrichorLegacy/bin/Release/netstandard2.1/PetrichorLegacy.dll package/PetrichorLegacy/
          cp PetrichorLegacy/manifest.json package/PetrichorLegacy/
          cp "$HOME/.nuget/packages/newtonsoft.json/12.0.3/lib/net45/Newtonsoft.Json.dll" package/PetrichorLegacy/
          cd package
          zip -r ../PetrichorLegacy-0.4.1.zip PetrichorLegacy
      - uses: actions/upload-artifact@v4
        with:
          name: PetrichorLegacy-0.4.1
          path: |
            PetrichorLegacy-0.4.1.zip
            package/PetrichorLegacy/PetrichorLegacy.dll
            package/PetrichorLegacy/Newtonsoft.Json.dll
          if-no-files-found: error