name: Deep Relationships v0.8 clean engine tests
on:
  push:
    branches:
      - rebuild/deep-relationships-v0.8
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7.17'
      - name: Run stage regression tests
        run: python -m unittest discover -s DeepRelationshipsRebuild/tests -v
      - name: Bundle v0.8 development sources
        run: |
          python - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path('DeepRelationshipsRebuild')
          output = pathlib.Path('DeepRelationships-v0.8-SOURCE-PREVIEW.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file() and '__pycache__' not in p.parts:
                      z.write(p, str(p))
          print(output, output.stat().st_size)
          PY
      - name: Upload development source archive
        uses: actions/upload-artifact@v4
        with:
          name: DeepRelationships-v0.8-SOURCE-PREVIEW
          path: DeepRelationships-v0.8-SOURCE-PREVIEW.zip
          if-no-files-found: error
      - name: Build v0.8.0 BETA ts4script
        run: python DeepRelationshipsRebuild/build_game.py
      - name: Upload v0.8 beta script
        uses: actions/upload-artifact@v4
        with:
          name: DeepRelationships-v0.8.4-DIAGNOSTIC-SCRIPT
          path: DeepRelationshipsRebuild/dist/DeepRelationships_v0.8.4_DIAGNOSTIC.ts4script
          if-no-files-found: error
