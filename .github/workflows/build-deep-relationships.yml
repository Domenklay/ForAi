name: Build Deep Relationships

on:
  push:
    branches:
      - build/deep-relationships-v0.7.2-core-stabilization
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.7.17'
      - name: Build v0.7.2 ts4script
        run: python DeepRelationships/build.py
      - name: Inspect ts4script
        shell: bash
        run: unzip -l DeepRelationships/dist/DeepRelationships_v0.7.2.ts4script
      - uses: actions/upload-artifact@v4
        with:
          name: DeepRelationships-v0.7.2-script
          path: DeepRelationships/dist/DeepRelationships_v0.7.2.ts4script
          if-no-files-found: error
