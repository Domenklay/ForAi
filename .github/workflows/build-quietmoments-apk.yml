name: Build QuietMoments Test APK
on:
  push:
    branches:
      - build/quietmoments-apk
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled SDK
        run: |
          test -f "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms/android-35/android.jar"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack isolated app project
        run: |
          base64 -d quietmoments_apk_build_payload.b64.txt > quietmoments-build.tar.xz
          mkdir -p quietmoments
          tar -xJf quietmoments-build.tar.xz -C quietmoments
      - name: Prepare wider-compatibility test build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('quietmoments/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'minSdk = 26': 'minSdk = 23',
              'versionCode = 6': 'versionCode = 7',
              'versionName = "0.5.0"': 'versionName = "0.5.1"',
              'applicationIdSuffix = ".beta05"': 'applicationIdSuffix = ".beta051"',
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit(f'Missing expected build value: {old}')
              s = s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('Built as com.quietmoments.diary.beta051, minSdk=23')
          PY
      - name: Rename launcher and app to My Video Diary v0.5.2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('quietmoments/app')
          gradle = root / 'build.gradle.kts'
          s = gradle.read_text(encoding='utf-8')
          for old,new in (
              ('versionCode = 7', 'versionCode = 8'),
              ('versionName = "0.5.1"', 'versionName = "0.5.2"'),
              ('applicationIdSuffix = ".beta051"', 'applicationIdSuffix = ".beta052"'),
          ):
              assert old in s, f'Missing {old}'
              s = s.replace(old,new,1)
          gradle.write_text(s, encoding='utf-8')

          strings = root / 'src/main/res/values/strings.xml'
          strings.write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n<string name="app_name">Видеодневник</string>\n</resources>\n', encoding='utf-8')

          manifest = root / 'src/main/AndroidManifest.xml'
          m = manifest.read_text(encoding='utf-8')
          m = m.replace('android:label="Тихие моменты · тест"', 'android:label="@string/app_name"')
          m = m.replace('android:label="Тихие моменты"', 'android:label="@string/app_name"')
          assert m.count('android:label="@string/app_name"') == 9
          manifest.write_text(m,encoding='utf-8')

          main = root / 'src/main/java/com/quietmoments/diary/MainActivity.kt'
          k = main.read_text(encoding='utf-8')
          changes = (
              ('Text("Тихие моменты", fontFamily = FontFamily.Serif, fontSize = 36.sp, color = Dark)', 'Text("Мой видеодневник", fontFamily = FontFamily.Serif, fontSize = 32.sp, color = Dark)'),
              ('Text("Тихие моменты", color = Dark, fontFamily = FontFamily.Serif, fontSize = 37.sp, lineHeight = 43.sp)', 'Text("Мой видеодневник", color = Dark, fontFamily = FontFamily.Serif, fontSize = 32.sp, lineHeight = 38.sp)'),
              ('Text("Твоя история, день за днём", color = Muted, fontSize = 13.sp)', 'Text("Тихие моменты — твоя история, день за днём", color = Muted, fontSize = 12.sp)'),
              ('"Тихие моменты · Версия 0.5"', '"Мой видеодневник · Версия 0.5.2"'),
          )
          for a,b in changes:
              assert a in k, f'Missing expected UI text: {a}'
              k = k.replace(a,b)
          main.write_text(k,encoding='utf-8')
          print('App display name: Видеодневник; package: com.quietmoments.diary.beta052')
          PY
      - name: Build debug APK
        env:
          ORG_GRADLE_PROJECT_YANDEX_CLIENT_ID: ${{ vars.YANDEX_CLIENT_ID }}
        working-directory: quietmoments
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify installable APK
        run: |
          APK="quietmoments/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SIGNER=$(find "$SDK/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)
          test -n "$SIGNER"
          "$SIGNER" verify --verbose --print-certs "$APK"
          AAPT=$(find "$SDK/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -n 1)
          if [ -n "$AAPT" ]; then "$AAPT" dump badging "$APK" | head -n 18; fi
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyVideoDiary-v0.5.2-apk
          path: quietmoments/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
