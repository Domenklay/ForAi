name: Build Sims4 LWC v0.6.3 immediate moodlets

on:
  push:
    branches:
      - build-sims4-lwc-022
    paths:
      - '.github/workflows/build-sims4-lwc-v042.yml'
      - 'sims4_lwc_build/build_v063.py'
      - 'sims4_lwc_build/bundle_v063.py'
      - 'sims4_lwc_build/lwc_v063_addon.py.txt'
      - 'sims4_lwc_build/build_simdata_v062.cjs'
      - 'sims4_lwc_build/v062_package/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.7'

      - name: Build v0.6.3 ts4script
        run: python sims4_lwc_build/build_v063.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Buff SimData
        run: |
          npm install --no-save @s4tk/models@0.6.14
          node sims4_lwc_build/build_simdata_v062.cjs

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Rebuild validated moodlet package
        run: dotnet run --project sims4_lwc_build/v062_package/PackageTool.csproj --configuration Release

      - name: Promote package to v0.6.3
        run: |
          mkdir -p dist_v063
          cp dist_v062/LifeWithConsequences_0.6.2.package dist_v063/LifeWithConsequences_0.6.3.package

      - name: Bundle release
        run: python sims4_lwc_build/bundle_v063.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LifeWithConsequences-v0.6.3-FULL
          path: |
            dist_v063/LifeWithConsequences_0.6.3_FULL.zip
            dist_v063/LifeWithConsequences_0.6.3_TS4_1.127.41.ts4script
            dist_v063/LifeWithConsequences_0.6.3.package
          if-no-files-found: error
          retention-days: 1
