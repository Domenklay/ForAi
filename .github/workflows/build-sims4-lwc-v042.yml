name: Build Sims4 LWC v0.6.4 immediate life moodlets

on:
  push:
    branches:
      - build-sims4-lwc-022
    paths:
      - '.github/workflows/build-sims4-lwc-v042.yml'
      - 'sims4_lwc_build/build_v064.py'
      - 'sims4_lwc_build/bundle_v064.py'
      - 'sims4_lwc_build/lwc_v064_addon.py.txt'
      - 'sims4_lwc_build/build_simdata_v064.cjs'
      - 'sims4_lwc_build/v064_package/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch pinned v0.4.2 source commit
        run: git fetch origin 44aa727d21d049bb98480821885bac8e4eae500c --depth=1

      - name: Setup Python 3.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.7'

      - name: Build v0.6.4 ts4script
        run: python sims4_lwc_build/build_v064.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate nine Buff SimData resources
        run: |
          npm install --no-save @s4tk/models@0.6.14
          node sims4_lwc_build/build_simdata_v064.cjs

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and validate v0.6.4 package
        run: dotnet run --project sims4_lwc_build/v064_package/PackageTool.csproj --configuration Release

      - name: Bundle release
        run: python sims4_lwc_build/bundle_v064.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LifeWithConsequences-v0.6.4-FULL
          path: |
            dist_v064/LifeWithConsequences_0.6.4_FULL.zip
            dist_v064/LifeWithConsequences_0.6.4_TS4_1.127.41.ts4script
            dist_v064/LifeWithConsequences_0.6.4.package
          if-no-files-found: error
          retention-days: 1
