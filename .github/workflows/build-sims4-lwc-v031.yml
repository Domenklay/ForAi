name: Build Sims4 LWC v0.3.1

on:
  push:
    branches:
      - build-sims4-lwc-022
    paths:
      - 'sims4_lwc_build/life_with_consequences_v031.py'
      - 'sims4_lwc_build/trigger-v031.txt'
      - '.github/workflows/build-sims4-lwc-v031.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.7'

      - name: Verify Python
        run: python --version

      - name: Compile and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build dist
          python -OO - <<'PY'
          import py_compile
          import zipfile
          from pathlib import Path
          src=Path('sims4_lwc_build/life_with_consequences_v031.py')
          pyc=Path('build/life_with_consequences.pyc')
          out=Path('dist/LifeWithConsequences_0.3.1_TS4_1.127.41.ts4script')
          py_compile.compile(str(src), cfile=str(pyc), doraise=True, optimize=2)
          with zipfile.ZipFile(str(out),'w',compression=zipfile.ZIP_DEFLATED) as z:
              z.write(str(pyc),'life_with_consequences.pyc')
          print(out)
          PY

      - name: Verify bytecode and archive
        run: |
          python - <<'PY'
          import importlib.util, zipfile
          p='dist/LifeWithConsequences_0.3.1_TS4_1.127.41.ts4script'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert names == ['life_with_consequences.pyc'], names
              data=z.read(names[0])
          print('magic=',data[:4].hex(),'expected=',importlib.util.MAGIC_NUMBER.hex())
          assert data[:4] == importlib.util.MAGIC_NUMBER
          PY

      - name: Upload finished ts4script
        uses: actions/upload-artifact@v4
        with:
          name: LifeWithConsequences-v0.3.1-TS4-1.127.41
          path: dist/LifeWithConsequences_0.3.1_TS4_1.127.41.ts4script
          if-no-files-found: error
          retention-days: 1
