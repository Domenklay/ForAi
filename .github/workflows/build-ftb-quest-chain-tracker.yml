name: Build FTB Quest Chain Tracker v0.3.1 Russian HUD
on:
  push:
    branches:
      - build/ftb-quest-chain-tracker-1211
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Extract client add-on sources
        run: |
          mkdir -p ftbchain
          tar -xJf ftbchain/ftbchain-src.tar.xz -C ftbchain
      - name: Localize original FTB Quests pinned HUD header (v0.3.1)
        working-directory: ftbchain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("src/main/java/com/domenklay/questchain/PinnedOverlayRenderer.java")
          text = source.read_text(encoding="utf-8")
          before = 'Component.translatable("ftbquests.pinned")'
          after = 'Component.translatable("hud.ftbchaintracker.header")'
          if before not in text:
              raise RuntimeError("Expected original HUD title code not found")
          source.write_text(text.replace(before, after), encoding="utf-8")
          props = Path("gradle.properties")
          cfg = props.read_text(encoding="utf-8")
          if "mod_version=0.3.0" not in cfg:
              raise RuntimeError("Unexpected base mod version")
          props.write_text(cfg.replace("mod_version=0.3.0", "mod_version=0.3.1"), encoding="utf-8")
          PY
      - name: Check chain-planner tests
        working-directory: ftbchain
        run: bash tests/run-planner-tests.sh
      - name: Compile NeoForge mod
        working-directory: ftbchain
        run: gradle --no-daemon build --stacktrace
      - name: Publish built JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FTB-Quest-Chain-Tracker-1.21.1-NeoForge-v0.3.1
          path: ftbchain/build/libs/*.jar
          if-no-files-found: error
