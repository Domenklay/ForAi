name: Build FTB Quest Chain Tracker (isolated branch)
on:
  push:
    branches:
      - build/ftb-quest-chain-tracker-1211
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Extract client add-on sources
        run: |
          mkdir -p ftbchain
          tar -xJf ftbchain/ftbchain-src.tar.xz -C ftbchain
      - name: Adapt FTB 2101 GUI + NeoForge tick imports
        working-directory: ftbchain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/main/java/com/domenklay/questchain/ClientTracker.java")
          s=p.read_text()
          s=s.replace("import net.neoforged.neoforge.event.tick.ClientTickEvent;", "import net.neoforged.neoforge.client.event.ClientTickEvent;\nimport dev.ftb.mods.ftblibrary.util.client.ClientUtils;")
          s=s.replace('        if (!(event.getScreen() instanceof QuestScreen screen)) return;', '        QuestScreen screen = ClientUtils.getCurrentGuiAs(QuestScreen.class);\n        if (screen == null) return;')
          s=s.replace('        if (event.getButton() != GLFW.GLFW_MOUSE_BUTTON_LEFT || !(event.getScreen() instanceof QuestScreen screen)) return;', '        if (event.getButton() != GLFW.GLFW_MOUSE_BUTTON_LEFT) return;\n        QuestScreen screen = ClientUtils.getCurrentGuiAs(QuestScreen.class);\n        if (screen == null) return;')
          s=s.replace('                && event.getScreen() instanceof QuestScreen screen) {', '                && ClientUtils.getCurrentGuiAs(QuestScreen.class) != null) {\n            QuestScreen screen = ClientUtils.getCurrentGuiAs(QuestScreen.class);')
          p.write_text(s)
          PY
      - name: Check chain-planner tests
        working-directory: ftbchain
        run: bash tests/run-planner-tests.sh
      - name: Compile NeoForge mod
        working-directory: ftbchain
        run: gradle --no-daemon build --stacktrace
      - name: Publish built JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FTB-Quest-Chain-Tracker-1.21.1-NeoForge
          path: ftbchain/build/libs/*.jar
          if-no-files-found: error
